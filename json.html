<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>JSON Lab - User Profiles</title>
</head>
<body>

<p><a href="index.html">Back</a></p>
<h1>User Profiles</h1>
<div id="users"></div>

<script>
fetch('userProfiles.json')
  .then(response => {
    if (!response.ok) throw new Error('Fetch error: ' + response.status);
    return response.json();
  })
  .then(users => {
    let s = '';
    users.forEach(u => {
      s += '<b>' + u.firstName + ' ' + u.lastName + '</b><br>';
      s += 'Email: ' + u.email + '<br>';
      s += 'Date of Birth: ' + u.dateOfBirth + '<br>';
      s += 'Address: ' + u.address.street + ', ' + u.address.city + ', ' + u.address.state + ' ' + u.address.zipCode + '<br>';
      s += 'Preferences: theme=' + u.preferences.theme + ', language=' + u.preferences.language +
           ', notifications=' + u.preferences.notifications + ', subscription=' + u.preferences.subscription + '<br>';
      s += '<br>';
    });
    document.getElementById('users').innerHTML = s;
  })
  .catch(err => console.error('Fetch error:', err.message));
</script>
</body>
</html>
